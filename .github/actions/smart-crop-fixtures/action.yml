name: Prepare smart crop validation images
description: Verify the private annotated inputs against the model lock.
inputs:
  archive-url:
    description: URL of the fixture ZIP from the release environment.
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      env:
        FIXTURE_URL: ${{ inputs.archive-url }}
      run: |
        if [[ -z "$FIXTURE_URL" ]]; then
          echo 'Configure SMART_CROP_FIXTURE_URL with the locked real/anime fixture ZIP.' >&2
          exit 1
        fi
        mkdir -p build/smart-crop-fixtures
        curl --fail --silent --location --retry 3 --max-time 120 "$FIXTURE_URL" -o build/smart-crop-fixtures/fixtures.zip
        python - <<'PY'
        from hashlib import sha256
        import json
        from pathlib import Path
        from zipfile import ZipFile

        root = Path('build/smart-crop-fixtures').resolve()
        fixtures = json.loads(Path('cmake/smart-crop-models.json').read_text(encoding='utf-8'))['fixtures']
        with ZipFile(root / 'fixtures.zip') as archive:
            for fixture in fixtures:
                name = fixture['file']
                entry = archive.getinfo(name)
                if entry.file_size != fixture['size']:
                    raise ValueError(f'Fixture size mismatch: {name}')
                data = archive.read(entry)
                if sha256(data).hexdigest() != fixture['sha256']:
                    raise ValueError(f'Fixture SHA-256 mismatch: {name}')
                target = root / name
                target.parent.mkdir(parents=True, exist_ok=True)
                target.write_bytes(data)
        PY
        echo "SMART_CROP_FIXTURE_ROOT=$(python -c 'from pathlib import Path; print(Path("build/smart-crop-fixtures").resolve().as_posix())')" >> "$GITHUB_ENV"
        python -m venv build/smart-crop-fixtures/python
        if [[ "$RUNNER_OS" == Windows ]]; then
          verifier=build/smart-crop-fixtures/python/Scripts/python.exe
        else
          verifier=build/smart-crop-fixtures/python/bin/python
        fi
        "$verifier" -m pip install -r scripts/requirements-smart-crop-verification.txt
        echo "SMART_CROP_VERIFY_PYTHON=$(python -c 'from pathlib import Path; import sys; print(Path(sys.argv[1]).absolute().as_posix())' "$verifier")" >> "$GITHUB_ENV"
