name: Native locked dependencies
description: Fingerprint, restore, install and immediately save native vcpkg dependencies.
inputs:
  source-directory:
    description: Checkout containing the product and dependency locks.
    default: '.'
  cache-namespace:
    description: Override only to isolate a cold/warm validation pair.
    default: deps-v1
  cold:
    description: Bypass Actions cache restore and save for a fresh dependency audit.
    default: 'false'
runs:
  using: composite
  steps:
    - name: Read the source dependency lock
      id: lock
      shell: bash
      env:
        SOURCE_DIR: ${{ inputs.source-directory }}
      run: cmake -DMODE=Lock "-DSOURCE_DIR=$SOURCE_DIR" -P cmake/PrepareRelease.cmake
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: microsoft/vcpkg
        ref: ${{ steps.lock.outputs.vcpkg-commit }}
        path: ${{ inputs.source-directory }}/build/tools/vcpkg
        persist-credentials: false
    - name: Prepare and fingerprint toolchain
      id: prepare
      shell: bash
      env:
        COLD: ${{ inputs.cold }}
        SOURCE_DIR: ${{ inputs.source-directory }}
        CACHE_NAMESPACE: ${{ inputs.cache-namespace }}
      run: |
        command=(cmake -DMODE=Prepare "-DSOURCE_DIR=$SOURCE_DIR" -DVCPKG_ROOT=build/tools/vcpkg "-DCACHE_NAMESPACE=$CACHE_NAMESPACE" -P cmake/PrepareRelease.cmake)
        if [[ "$RUNNER_OS" == Linux && "$COLD" == true ]]; then
          cmake -DLOG=build/dependency-state/prepare-execve.log -P cmake/AuditRelease.cmake -- "${command[@]}"
        else
          "${command[@]}"
        fi
    - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      if: inputs.cold != 'true'
      id: restore
      with:
        path: ${{ steps.prepare.outputs.cache-path }}
        key: ${{ steps.prepare.outputs.cache-key }}
        restore-keys: ${{ steps.prepare.outputs.cache-prefix }}
    - name: Install minimal Release dependencies
      shell: bash
      env:
        COLD: ${{ inputs.cold }}
        SOURCE_DIR: ${{ inputs.source-directory }}
      run: |
        command=(cmake -DMODE=Install "-DSOURCE_DIR=$SOURCE_DIR" -P cmake/PrepareRelease.cmake)
        if [[ "$RUNNER_OS" == Linux && "$COLD" == true ]]; then
          cmake -DLOG=build/dependency-state/execve.log -P cmake/AuditRelease.cmake -- "${command[@]}"
          grep -Eq '"restoredPackages":0}' build/dependency-state/x64-linux-release/install-summary.json
        else
          "${command[@]}"
        fi
    - name: Save dependencies before project tests
      if: inputs.cold != 'true' && steps.prepare.outputs.cache-write == 'true' && steps.restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.prepare.outputs.cache-path }}
        key: ${{ steps.prepare.outputs.cache-key }}
