name: Portable GPU candidates
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: portable-gpu-${{ github.ref }}
  cancel-in-progress: true
jobs:
  candidate:
    name: ${{ matrix.platform }} ${{ matrix.backend }} candidate
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            runner: windows-2025-vs2026
            backend: vulkan
          - platform: linux-x64
            runner: ubuntu-22.04
            backend: vulkan
          - platform: macos-arm64
            runner: macos-15
            backend: metal
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Linux build and archive tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ninja-build glslang-tools patchelf
      - uses: ./.github/actions/native-dependencies
      - name: Prepare pinned Vulkan headers and offline compiler
        if: matrix.backend == 'vulkan'
        run: cmake -DMODE=Vulkan -P cmake/PrepareRelease.cmake
      - name: Prepare Apple offline shader compiler
        if: matrix.backend == 'metal'
        run: |
          xcrun -sdk macosx metal --version || xcodebuild -downloadComponent MetalToolchain
      - name: Build, test and archive explicit-only candidate
        run: cmake -DRUNTIME=${{ matrix.backend }} -DCHANNEL=candidate -DBUILD_DIR=build/package-portable -P cmake/Release.cmake
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: portable-${{ matrix.platform }}-${{ matrix.backend }}
          path: build/archives/*
          if-no-files-found: error
      - name: Upload compilation and test diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: portable-diagnostics-${{ matrix.platform }}
          path: |
            build/dependency-state/
            build/package-portable/Testing/Temporary/
          if-no-files-found: ignore
