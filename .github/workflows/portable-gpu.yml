name: Portable GPU candidates
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate:
    name: ${{ matrix.platform }} ${{ matrix.backend }} candidate
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            runner: windows-2025-vs2026
            triplet: x64-windows-release
            backend: Vulkan
          - platform: linux-x64
            runner: ubuntu-22.04
            triplet: x64-linux-release
            backend: Vulkan
          - platform: macos-arm64
            runner: macos-15
            triplet: arm64-osx-release
            backend: Metal
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/dependencies
        with:
          triplet: ${{ matrix.triplet }}
      - name: Install Linux build and archive tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends glslang-tools patchelf
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prepare pinned Vulkan headers and offline compiler
        if: matrix.backend == 'Vulkan'
        run: ./scripts/setup-vulkan.ps1
      - name: Build, test and archive explicit-only candidate
        run: |
          $options = @{ NoCuda = $true; OutputDir = 'build/archives'; BuildDir = 'build/package-portable' }
          $options['${{ matrix.backend }}'] = $true
          ./scripts/release.ps1 @options
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: portable-${{ matrix.platform }}-${{ matrix.backend }}
          path: build/archives/*
          if-no-files-found: error
      - name: Upload compilation and test diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: portable-diagnostics-${{ matrix.platform }}
          path: |
            build/dependency-state/
            build/package-portable/Testing/Temporary/
            build/package-portable/release-timings.json
          if-no-files-found: ignore
