name: Native packages
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      desktop_release_tag:
        description: Build only CUDA + Vulkan Qt packages from this existing release tag (no publishing)
        required: false
        type: string
      include_native_cuda:
        description: Also rebuild native CUDA packages when supplementing a release tag
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  native-package:
    if: ${{ !inputs.desktop_release_tag }}
    name: Package ${{ matrix.platform }} ${{ matrix.runtime }}
    env:
      SMART_CROP: ${{ vars.MOSAICRAFT_SMART_CROP_RELEASE == '1' && 'ON' || 'OFF' }}
    strategy: &native_matrix
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            runtime: cpu-only
            runner: windows-2025-vs2026
          - platform: linux-x64
            runtime: cpu-only
            runner: ubuntu-22.04
          - platform: macos-arm64
            runtime: cpu-only
            runner: macos-15
          - platform: windows-x64
            runtime: vulkan
            runner: windows-2025-vs2026
          - platform: linux-x64
            runtime: vulkan
            runner: ubuntu-22.04
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install packaging tool
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          tools=(ninja-build patchelf)
          if [[ '${{ matrix.runtime }}' == vulkan ]]; then tools+=(glslang-tools); fi
          sudo apt-get install -y --no-install-recommends "${tools[@]}"
      - name: Verify and prepare locked offline smart crop models
        if: env.SMART_CROP == 'ON'
        run: |
          cmake -DMODE=SmartCropGate -P cmake/PrepareRelease.cmake
          python -m pip install -r scripts/requirements-smart-crop-verification.txt
          cmake -DMODE=Models -P cmake/PrepareRelease.cmake
      - uses: ./.github/actions/native-dependencies
        with:
          smart-crop: ${{ env.SMART_CROP }}
      - name: Prepare pinned Vulkan headers and offline compiler
        if: matrix.runtime == 'vulkan'
        run: cmake -DMODE=Vulkan -P cmake/PrepareRelease.cmake
      - name: Build, test and package native Release
        run: cmake -DRUNTIME=${{ matrix.runtime }} -DBUILD_DIR=build/package-${{ matrix.runtime }} "-DSMART_CROP=$SMART_CROP" -P cmake/Release.cmake
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.runtime == 'cpu-only' && 'cpu' || matrix.runtime }}-${{ matrix.platform }}
          path: build/archives/*
          if-no-files-found: error
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.runtime }}-diagnostics-${{ matrix.platform }}
          path: |
            build/dependency-state/
            build/package-${{ matrix.runtime }}/Testing/Temporary/
          if-no-files-found: ignore
  native-verify:
    if: ${{ !inputs.desktop_release_tag }}
    name: Standalone ${{ matrix.platform }} ${{ matrix.runtime }}
    needs: native-package
    strategy: *native_matrix
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ matrix.runtime == 'cpu-only' && 'cpu' || matrix.runtime }}-${{ matrix.platform }}
          path: build/download
      # Build only the independent checker, without project dependencies.
      - uses: ./.github/actions/verify-native-package
        with:
          runtime: ${{ matrix.runtime }}
          gpu-validation: ${{ matrix.runtime == 'vulkan' && 'not-run' || 'not-applicable' }}
          channel: stable
  cuda-package:
    if: ${{ !inputs.desktop_release_tag || inputs.include_native_cuda }}
    name: Package ${{ matrix.platform }} CUDA
    outputs:
      source-commit: ${{ steps.product.outputs.commit || github.sha }}
    env:
      PACKAGE_SOURCE: ${{ inputs.desktop_release_tag && 'build/package-source' || '.' }}
      SMART_CROP: ${{ !inputs.desktop_release_tag && vars.MOSAICRAFT_SMART_CROP_RELEASE == '1' && 'ON' || 'OFF' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            runner: windows-2025-vs2026
          - platform: linux-x64
            runner: ubuntu-22.04
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Keep the tag immutable: only SDK preparation comes from the workflow revision.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: product
        if: inputs.desktop_release_tag
        with:
          ref: ${{ format('refs/tags/{0}', inputs.desktop_release_tag) }}
          path: build/package-source
          persist-credentials: false
      - name: Check source version before packaging
        if: inputs.desktop_release_tag
        env:
          SOURCE_TAG: ${{ inputs.desktop_release_tag }}
        run: '[[ "$SOURCE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ && "$SOURCE_TAG" == "v$(jq -r .softwareVersion "$PACKAGE_SOURCE/contracts.json")" ]]'
      - name: Install packaging tool
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ninja-build patchelf
      - name: Verify and prepare locked offline smart crop models
        if: env.SMART_CROP == 'ON'
        run: |
          cmake -DMODE=SmartCropGate -P cmake/PrepareRelease.cmake
          python -m pip install -r scripts/requirements-smart-crop-verification.txt
          cmake -DMODE=Models -P cmake/PrepareRelease.cmake
      - uses: ./.github/actions/native-dependencies
        with:
          source-directory: ${{ env.PACKAGE_SOURCE }}
          smart-crop: ${{ env.SMART_CROP }}
      - name: Install hash-locked CUDA 13.5.37 compiler and runtime
        run: cmake "-DSOURCE_DIR=$PACKAGE_SOURCE" -DMODE=CUDA -P cmake/PrepareRelease.cmake
      - name: Build and verify seven CUDA architectures
        shell: bash
        run: |
          options=(-DCHANNEL=candidate)
          if [[ "$RUNNER_OS" == Linux ]]; then
            options=(-DCHANNEL=stable -DALLOW_UNVALIDATED_LINUX_CUDA=ON)
          fi
          cd "$PACKAGE_SOURCE"
          cmake -DRUNTIME=cuda -DBUILD_DIR=build/package-cuda -DCUDA_VALIDATION=BuildOnly "-DSMART_CROP=$SMART_CROP" "${options[@]}" -P cmake/Release.cmake
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cuda-${{ matrix.platform }}
          path: ${{ env.PACKAGE_SOURCE }}/build/archives/*
          if-no-files-found: error
      - name: Upload CUDA diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cuda-diagnostics-${{ matrix.platform }}
          path: |
            ${{ env.PACKAGE_SOURCE }}/build/dependency-state/
            ${{ env.PACKAGE_SOURCE }}/build/package-cuda/Testing/Temporary/
            ${{ env.PACKAGE_SOURCE }}/build/package-cuda/cuda-architectures.txt
          if-no-files-found: ignore
  cuda-verify:
    name: Standalone ${{ matrix.platform }} CUDA
    if: ${{ !inputs.desktop_release_tag || inputs.include_native_cuda }}
    needs: cuda-package
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            runner: windows-2025-vs2026
          - platform: linux-x64
            runner: ubuntu-22.04
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cuda-${{ matrix.platform }}
          path: build/download
      - uses: ./.github/actions/verify-native-package
        with:
          expected-commit: ${{ needs.cuda-package.outputs.source-commit }}
          runtime: cuda
          gpu-validation: not-run
          channel: ${{ runner.os == 'Windows' && 'candidate' || 'stable' }}
  qt-package:
    name: Package ${{ matrix.platform }} Qt Desktop (${{ matrix.runtime }})
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-x64, linux-x64, macos-arm64]
        runtime: ${{ fromJSON(inputs.desktop_release_tag && '["cuda-vulkan"]' || '["cpu", "cuda-vulkan"]') }}
        exclude:
          - platform: macos-arm64
            runtime: cuda-vulkan
    runs-on: ${{ matrix.platform == 'windows-x64' && 'windows-2025-vs2026' || matrix.platform == 'linux-x64' && 'ubuntu-24.04' || 'macos-26' }}
    env:
      PACKAGE_SOURCE: ${{ inputs.desktop_release_tag && 'build/package-source' || '.' }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Validate supplemental release tag
        if: inputs.desktop_release_tag
        env:
          RELEASE_TAG: ${{ inputs.desktop_release_tag }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Expected a stable release tag such as v1.15.11' >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Keep the tag's source and locks separate from the current packaging tools.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: inputs.desktop_release_tag
        with:
          ref: ${{ format('refs/tags/{0}', inputs.desktop_release_tag) }}
          path: build/package-source
          persist-credentials: false
      - name: Install Linux linker and display libraries (no system Qt)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ninja-build patchelf libgl-dev libegl-dev libopengl-dev \
            libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-render-util0 libxcb-xkb1 libxcb-xinerama0 libxcb-xinput0 \
            libx11-xcb1 libxcb-randr0 libxcb-shape0 libxcb-shm0 libxcb-sync1 libxcb-xfixes0 \
            libwayland-client0 libwayland-cursor0 libwayland-egl1
          if [[ '${{ matrix.runtime }}' == 'cuda-vulkan' ]]; then
            sudo apt-get install -y --no-install-recommends glslang-tools xvfb xauth
          fi
      - uses: ./.github/actions/native-dependencies
        with:
          source-directory: ${{ inputs.desktop_release_tag && 'build/package-source' || '.' }}
      - name: Prepare locked Qt SDK
        run: cmake "-DSOURCE_DIR=$PACKAGE_SOURCE" -DMODE=Qt -P cmake/PrepareRelease.cmake
      - name: Check Qt XCB host libraries before compiling
        if: runner.os == 'Linux' && matrix.runtime == 'cuda-vulkan'
        shell: bash
        run: |
          dependencies=$(ldd "$MOSAICRAFT_QT_ROOT/plugins/platforms/libqxcb.so")
          if grep -F 'not found' <<< "$dependencies"; then exit 1; fi
      - name: Prepare locked CUDA SDK and Vulkan build tools
        if: matrix.runtime == 'cuda-vulkan'
        run: |
          cmake "-DSOURCE_DIR=$PACKAGE_SOURCE" -DMODE=CUDA -P cmake/PrepareRelease.cmake
          cmake "-DSOURCE_DIR=$PACKAGE_SOURCE" -DMODE=Vulkan -P cmake/PrepareRelease.cmake
      - name: Build and verify Qt Desktop archive
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.desktop_release_tag }}
          QT_RUNTIME: ${{ matrix.runtime }}
        run: |
          options=("-DEXPECTED_COMMIT=$GITHUB_SHA" -DRUNTIME=cpu-only)
          if [[ "$QT_RUNTIME" == cuda-vulkan ]]; then
            options+=(-DRUNTIME=cuda-vulkan -DGPU_VALIDATION=BuildOnly)
          fi
          if [[ -n "$RELEASE_TAG" ]]; then
            commit=$(git -C "$PACKAGE_SOURCE" rev-parse "refs/tags/$RELEASE_TAG^{commit}")
            options+=("-DEXPECTED_COMMIT=$commit" "-DSOURCE_TAG=$RELEASE_TAG")
          fi
          cmake "-DSOURCE_DIR=$PACKAGE_SOURCE" "-DOUTPUT_DIR=$PWD/build/archives-qt" \
            "${options[@]}" -P cmake/ReleaseDesktop.cmake
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.runtime == 'cpu' && format('qt-{0}', matrix.platform) || format('qt-cuda-vulkan-{0}', matrix.platform) }}
          path: build/archives-qt/Mosaicraft_v*
          compression-level: 0
          if-no-files-found: error
