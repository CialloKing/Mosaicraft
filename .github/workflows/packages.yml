name: Native packages
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      skip_tests:
        description: Skip CTest, smoke and archive validation
        required: false
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  cpu-package:
    name: Package ${{ matrix.platform }} CPU-only
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            runner: windows-2025-vs2026
            triplet: x64-windows-release
          - platform: linux-x64
            runner: ubuntu-22.04
            triplet: x64-linux-release
          - platform: macos-arm64
            runner: macos-15
            triplet: arm64-osx-release
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/dependencies
        with:
          triplet: ${{ matrix.triplet }}
      - name: Install packaging tool
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends patchelf
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build, test and package CPU Release
        run: |
          $releaseOptions = @{}
          if ('${{ github.event_name }}' -eq 'workflow_dispatch' -and '${{ inputs.skip_tests }}' -eq 'true') {
            $releaseOptions.SkipTests = $true
            $releaseOptions.SkipSmoke = $true
            $releaseOptions.SkipArchiveValidation = $true
          }
          ./scripts/release.ps1 -BuildDir build/package-cpu -NoCuda -OutputDir build/archives @releaseOptions
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cpu-${{ matrix.platform }}
          path: build/archives/*
          if-no-files-found: error
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-diagnostics-${{ matrix.platform }}
          path: |
            build/dependency-state/
            build/package-cpu/Testing/Temporary/
            build/package-cpu/release-timings.json
          if-no-files-found: ignore
  cpu-verify:
    name: Standalone ${{ matrix.platform }} CPU-only
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.skip_tests != true }}
    needs: cpu-package
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            runner: windows-2025-vs2026
          - platform: linux-x64
            runner: ubuntu-22.04
          - platform: macos-arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cpu-${{ matrix.platform }}
          path: build/download
      # Do not install vcpkg or project build dependencies in this fresh job.
      - name: Verify archive without build dependencies
        run: |
          $archive = @(Get-ChildItem build/download -File | Where-Object { $_.Name -match '\.(zip|tar\.gz)$' })
          if ($archive.Count -ne 1) { throw 'Expected exactly one native archive' }
          $hash = ((Get-Content "$($archive[0].FullName).sha256" -Raw) -split '\s+')[0]
          ./scripts/verify-release-asset.ps1 -ArchivePath $archive[0].FullName -ExpectedSha256 $hash -ExpectedCommit '${{ github.sha }}' -ExpectedRuntime cpu-only -ExpectedGpuValidation not-applicable -RequireStandalone
  cuda-package:
    name: Package ${{ matrix.platform }} CUDA
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            runner: windows-2025-vs2026
            triplet: x64-windows-release
          - platform: linux-x64
            runner: ubuntu-22.04
            triplet: x64-linux-release
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/dependencies
        with:
          triplet: ${{ matrix.triplet }}
      - name: Install hash-locked CUDA 13.5.37 compiler and runtime
        run: ./scripts/setup-cuda.ps1
      - name: Install packaging tool
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends patchelf
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build seven-architecture CUDA package and inspect native/PTX images
        run: |
          $releaseOptions = @{}
          if ('${{ github.event_name }}' -eq 'workflow_dispatch' -and '${{ inputs.skip_tests }}' -eq 'true') {
            $releaseOptions.SkipTests = $true
            $releaseOptions.SkipSmoke = $true
            $releaseOptions.SkipArchiveValidation = $true
            $releaseOptions.AllowUntestedRelease = $true
          }
          if ($IsLinux) { $releaseOptions.AllowUnvalidatedCudaRelease = $true }
          ./scripts/release.ps1 -BuildDir build/package-cuda -CudaValidation BuildOnly -OutputDir build/archives @releaseOptions
      - name: Prove Required mode rejects a runner without GPU
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.skip_tests != true }}
        run: |
          $extension = if ($IsWindows) { '.exe' } else { '' }
          $probe = & "./build/package-cuda/Release/bin/mosaicraft_tests$extension" --require-cuda 2>&1 | Out-String
          if ($LASTEXITCODE -eq 0 -or $probe -notmatch 'requires an available CUDA device') { throw "Unexpected GPU-required result: $probe" }
          $global:LASTEXITCODE = 0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cuda-${{ matrix.platform }}
          path: build/archives/*
          if-no-files-found: error
      - name: Upload CUDA diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cuda-diagnostics-${{ matrix.platform }}
          path: |
            build/dependency-state/
            build/package-cuda/Testing/Temporary/
            build/package-cuda/release-timings.json
            build/package-cuda/cuda-architectures.txt
          if-no-files-found: ignore
  cuda-verify:
    name: Standalone ${{ matrix.platform }} CUDA
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.skip_tests != true }}
    needs: cuda-package
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            runner: windows-2025-vs2026
          - platform: linux-x64
            runner: ubuntu-22.04
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cuda-${{ matrix.platform }}
          path: build/download
      - name: Verify CUDA package without CUDA toolkit or GPU
        run: |
          $pattern = if ($IsLinux) { '_linux-x64_cuda\.tar\.gz$' } else { '_windows-x64_cuda_candidate\.zip$' }
          $archive = @(Get-ChildItem build/download -File | Where-Object { $_.Name -match $pattern })
          if ($archive.Count -ne 1) { throw 'Expected exactly one CUDA package with the platform release policy' }
          $hash = ((Get-Content "$($archive[0].FullName).sha256" -Raw) -split '\s+')[0]
          ./scripts/verify-release-asset.ps1 -ArchivePath $archive[0].FullName -ExpectedSha256 $hash -ExpectedCommit '${{ github.sha }}' -ExpectedRuntime cuda -ExpectedGpuValidation not-run -RequireStandalone
