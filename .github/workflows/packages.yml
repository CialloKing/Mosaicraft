name: Native packages
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      desktop_release_tag:
        description: Rebuild the CUDA + Vulkan Qt packages from an existing release tag
        required: false
        type: string
permissions:
  contents: read
jobs:
  matrix:
    runs-on: ubuntu-22.04
    outputs:
      native: ${{ steps.packages.outputs.native }}
      qt: ${{ steps.packages.outputs.qt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: packages
        env:
          SUPPLEMENT: ${{ inputs.desktop_release_tag }}
        run: |
          echo "native=$(jq -c '{include: [.include[] | select(.kind == "native")]}' cmake/release-packages.json)" >> "$GITHUB_OUTPUT"
          echo "qt=$(jq -c --arg tag "$SUPPLEMENT" \
            '{include: [.include[] | select(.kind == "qt" and ($tag == "" or .runtime == "cuda-vulkan"))]}' \
            cmake/release-packages.json)" >> "$GITHUB_OUTPUT"
  native-package:
    if: ${{ !inputs.desktop_release_tag }}
    needs: matrix
    name: Package ${{ matrix.platform }} smart crop
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.native) }}
    runs-on: ${{ matrix.runner }}
    env:
      GPU_BUILD: ${{ matrix.runtime == 'cuda-vulkan' && 'ON' || 'OFF' }}
      PACKAGE_RUNTIME: ${{ matrix.runtime }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ninja-build patchelf glslang-tools
      - name: Prepare pinned CUDA and Vulkan SDKs
        if: matrix.runtime == 'cuda-vulkan'
        run: |
          cmake -DMODE=CUDA -P cmake/PrepareRelease.cmake
          cmake -DMODE=Vulkan -P cmake/PrepareRelease.cmake
          cmake -DMODE=SmartCropVulkan -P cmake/PrepareRelease.cmake
      - name: Prepare locked Vulkan smart crop models
        if: matrix.runtime == 'cuda-vulkan'
        run: cmake -DMODE=SmartCropVulkanModels -P cmake/PrepareRelease.cmake
      - uses: ./.github/actions/native-dependencies
        with:
          smart-crop: 'ON'
          smart-crop-cutlass: ${{ env.GPU_BUILD }}
      - name: Build and verify the smart crop package
        run: |
          cmake -DMODE=Models -P cmake/PrepareRelease.cmake
          options=()
          if [[ "$GPU_BUILD" == ON ]]; then
            options+=(-DCUDA_VALIDATION=BuildOnly)
            if [[ "$RUNNER_OS" == Windows ]]; then
              options+=(-DCHANNEL=candidate)
            else
              options+=(-DALLOW_UNVALIDATED_LINUX_CUDA=ON)
            fi
          fi
          cmake "-DRUNTIME=$PACKAGE_RUNTIME" -DBUILD_DIR=build/package-smart-crop -DSMART_CROP=ON \
            "-DSMART_CROP_CUDA=$GPU_BUILD" "-DSMART_CROP_VULKAN=$GPU_BUILD" "-DSMART_CROP_CUTLASS=$GPU_BUILD" \
            "${options[@]}" -P cmake/Release.cmake
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-native-${{ matrix.platform }}
          path: build/archives/*
          if-no-files-found: error
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diagnostics-native-${{ matrix.platform }}
          path: |
            build/dependency-state/
            build/package-smart-crop/Testing/Temporary/
          if-no-files-found: ignore
  qt-package:
    name: Package ${{ matrix.platform }} Qt Desktop (${{ matrix.runtime }})
    needs: matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.qt) }}
    runs-on: ${{ matrix.runner }}
    env:
      PACKAGE_SOURCE: ${{ inputs.desktop_release_tag && 'build/package-source' || '.' }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Validate supplemental release tag
        if: inputs.desktop_release_tag
        env:
          RELEASE_TAG: ${{ inputs.desktop_release_tag }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Expected a stable release tag such as v1.15.11' >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Keep the tag's source and locks separate from the current packaging tools.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: inputs.desktop_release_tag
        with:
          ref: ${{ format('refs/tags/{0}', inputs.desktop_release_tag) }}
          path: build/package-source
          persist-credentials: false
      - name: Install Linux linker and display libraries (no system Qt)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ninja-build patchelf libgl-dev libegl-dev libopengl-dev \
            libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-render-util0 libxcb-xkb1 libxcb-xinerama0 libxcb-xinput0 \
            libx11-xcb1 libxcb-randr0 libxcb-shape0 libxcb-shm0 libxcb-sync1 libxcb-xfixes0 \
            libwayland-client0 libwayland-cursor0 libwayland-egl1
          if [[ '${{ matrix.runtime }}' == 'cuda-vulkan' ]]; then
            sudo apt-get install -y --no-install-recommends glslang-tools xvfb xauth
          fi
      - uses: ./.github/actions/native-dependencies
        with:
          source-directory: ${{ inputs.desktop_release_tag && 'build/package-source' || '.' }}
      - name: Prepare locked Qt SDK
        run: cmake "-DSOURCE_DIR=$PACKAGE_SOURCE" -DMODE=Qt -P cmake/PrepareRelease.cmake
      - name: Check Qt XCB host libraries before compiling
        if: runner.os == 'Linux' && matrix.runtime == 'cuda-vulkan'
        shell: bash
        run: |
          dependencies=$(ldd "$MOSAICRAFT_QT_ROOT/plugins/platforms/libqxcb.so")
          if grep -F 'not found' <<< "$dependencies"; then exit 1; fi
      - name: Prepare locked CUDA SDK and Vulkan build tools
        if: matrix.runtime == 'cuda-vulkan'
        run: |
          cmake "-DSOURCE_DIR=$PACKAGE_SOURCE" -DMODE=CUDA -P cmake/PrepareRelease.cmake
          cmake "-DSOURCE_DIR=$PACKAGE_SOURCE" -DMODE=Vulkan -P cmake/PrepareRelease.cmake
      - name: Build and verify Qt Desktop archive
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.desktop_release_tag }}
          QT_RUNTIME: ${{ matrix.runtime }}
        run: |
          options=("-DEXPECTED_COMMIT=$GITHUB_SHA" -DRUNTIME=cpu-only)
          if [[ "$QT_RUNTIME" == cuda-vulkan ]]; then
            options+=(-DRUNTIME=cuda-vulkan -DGPU_VALIDATION=BuildOnly)
          fi
          if [[ -n "$RELEASE_TAG" ]]; then
            commit=$(git -C "$PACKAGE_SOURCE" rev-parse "refs/tags/$RELEASE_TAG^{commit}")
            options+=("-DEXPECTED_COMMIT=$commit" "-DSOURCE_TAG=$RELEASE_TAG")
          fi
          cmake "-DSOURCE_DIR=$PACKAGE_SOURCE" "-DOUTPUT_DIR=$PWD/build/archives-qt" \
            "${options[@]}" -P cmake/ReleaseDesktop.cmake
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-qt-${{ matrix.platform }}
          path: build/archives-qt/Mosaicraft_v*
          compression-level: 0
          if-no-files-found: error
  release-set:
    if: ${{ !inputs.desktop_release_tag }}
    needs: [native-package, qt-package]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*-*
          merge-multiple: true
          path: build/release-set
      - name: Check the exact archive set and write SHA256SUMS.txt
        run: cmake "-DTAG=v$(jq -r .softwareVersion contracts.json)" -DHOSTED=ON -DARCHIVE_DIR=build/release-set -P cmake/VerifyReleaseSet.cmake
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-six-package-set
          path: build/release-set
          compression-level: 0
          if-no-files-found: error
