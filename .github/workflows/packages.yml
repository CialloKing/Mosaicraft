name: Native packages
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      skip_tests:
        description: Skip CTest, smoke and archive validation
        required: false
        type: boolean
        default: false
      desktop_release_tag:
        description: Build only CUDA + Vulkan Qt packages from this existing release tag (no publishing)
        required: false
        type: string
permissions:
  contents: read
jobs:
  native-package:
    if: ${{ !inputs.desktop_release_tag }}
    name: Package ${{ matrix.platform }} ${{ matrix.runtime }}
    strategy: &native_matrix
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            runtime: cpu
            runner: windows-2025-vs2026
            triplet: x64-windows-release
          - platform: linux-x64
            runtime: cpu
            runner: ubuntu-22.04
            triplet: x64-linux-release
          - platform: macos-arm64
            runtime: cpu
            runner: macos-15
            triplet: arm64-osx-release
          - platform: windows-x64
            runtime: vulkan
            runner: windows-2025-vs2026
            triplet: x64-windows-release
          - platform: linux-x64
            runtime: vulkan
            runner: ubuntu-22.04
            triplet: x64-linux-release
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/dependencies
        with:
          triplet: ${{ matrix.triplet }}
      - name: Install packaging tool
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          $tools = @('patchelf')
          if ('${{ matrix.runtime }}' -eq 'vulkan') { $tools += 'glslang-tools' }
          sudo apt-get install -y --no-install-recommends @tools
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prepare pinned Vulkan headers and offline compiler
        if: matrix.runtime == 'vulkan'
        run: ./scripts/setup-vulkan.ps1
      - name: Build, test and package native Release
        run: |
          $releaseOptions = @{}
          if ('${{ matrix.runtime }}' -eq 'vulkan') { $releaseOptions.VulkanRelease = $true }
          elseif ('${{ github.event_name }}' -eq 'workflow_dispatch' -and '${{ inputs.skip_tests }}' -eq 'true') {
            $releaseOptions.SkipTests = $true
            $releaseOptions.SkipSmoke = $true
            $releaseOptions.SkipArchiveValidation = $true
          }
          ./scripts/release.ps1 -BuildDir build/package-${{ matrix.runtime }} -NoCuda -OutputDir build/archives @releaseOptions
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.runtime }}-${{ matrix.platform }}
          path: build/archives/*
          if-no-files-found: error
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.runtime }}-diagnostics-${{ matrix.platform }}
          path: |
            build/dependency-state/
            build/package-${{ matrix.runtime }}/Testing/Temporary/
            build/package-${{ matrix.runtime }}/release-timings.json
          if-no-files-found: ignore
  native-verify:
    if: ${{ !inputs.desktop_release_tag }}
    name: Standalone ${{ matrix.platform }} ${{ matrix.runtime }}
    needs: native-package
    strategy: *native_matrix
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ matrix.runtime }}-${{ matrix.platform }}
          path: build/download
      # Do not install vcpkg or project build dependencies in this fresh job.
      - name: Verify archive without build dependencies
        if: matrix.runtime == 'vulkan' || github.event_name != 'workflow_dispatch' || inputs.skip_tests != true
        run: |
          $archive = @(Get-ChildItem build/download -File | Where-Object { $_.Name -match '\.(zip|tar\.gz)$' })
          if ($archive.Count -ne 1) { throw 'Expected exactly one native archive' }
          $hash = ((Get-Content "$($archive[0].FullName).sha256" -Raw) -split '\s+')[0]
          $runtime = if ('${{ matrix.runtime }}' -eq 'vulkan') { 'vulkan' } else { 'cpu-only' }
          $validation = if ($runtime -eq 'vulkan') { 'not-run' } else { 'not-applicable' }
          ./scripts/verify-release-asset.ps1 -ArchivePath $archive[0].FullName -ExpectedSha256 $hash -ExpectedCommit '${{ github.sha }}' -ExpectedRuntime $runtime -ExpectedGpuValidation $validation -RequireStandalone
  cuda-package:
    if: ${{ !inputs.desktop_release_tag }}
    name: Package ${{ matrix.platform }} CUDA
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            runner: windows-2025-vs2026
            triplet: x64-windows-release
          - platform: linux-x64
            runner: ubuntu-22.04
            triplet: x64-linux-release
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/dependencies
        with:
          triplet: ${{ matrix.triplet }}
      - name: Install hash-locked CUDA 13.5.37 compiler and runtime
        run: ./scripts/setup-cuda.ps1
      - name: Install packaging tool
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends patchelf
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build seven-architecture CUDA package and inspect native/PTX images
        run: |
          $releaseOptions = @{}
          if ('${{ github.event_name }}' -eq 'workflow_dispatch' -and '${{ inputs.skip_tests }}' -eq 'true') {
            $releaseOptions.SkipTests = $true
            $releaseOptions.SkipSmoke = $true
            $releaseOptions.SkipArchiveValidation = $true
            $releaseOptions.AllowUntestedRelease = $true
          }
          if ($IsLinux) { $releaseOptions.AllowUnvalidatedCudaRelease = $true }
          ./scripts/release.ps1 -BuildDir build/package-cuda -CudaValidation BuildOnly -OutputDir build/archives @releaseOptions
      - name: Prove Required mode rejects a runner without GPU
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.skip_tests != true }}
        run: |
          $extension = if ($IsWindows) { '.exe' } else { '' }
          $probe = & "./build/package-cuda/Release/bin/mosaicraft_tests$extension" --require-cuda 2>&1 | Out-String
          if ($LASTEXITCODE -eq 0 -or $probe -notmatch 'requires an available CUDA device') { throw "Unexpected GPU-required result: $probe" }
          $global:LASTEXITCODE = 0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cuda-${{ matrix.platform }}
          path: build/archives/*
          if-no-files-found: error
      - name: Upload CUDA diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cuda-diagnostics-${{ matrix.platform }}
          path: |
            build/dependency-state/
            build/package-cuda/Testing/Temporary/
            build/package-cuda/release-timings.json
            build/package-cuda/cuda-architectures.txt
          if-no-files-found: ignore
  cuda-verify:
    name: Standalone ${{ matrix.platform }} CUDA
    if: ${{ !inputs.desktop_release_tag && (github.event_name != 'workflow_dispatch' || inputs.skip_tests != true) }}
    needs: cuda-package
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            runner: windows-2025-vs2026
          - platform: linux-x64
            runner: ubuntu-22.04
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cuda-${{ matrix.platform }}
          path: build/download
      - name: Verify CUDA package without CUDA toolkit or GPU
        run: |
          $pattern = if ($IsLinux) { '_linux-x64_cuda\.tar\.gz$' } else { '_windows-x64_cuda_candidate\.zip$' }
          $archive = @(Get-ChildItem build/download -File | Where-Object { $_.Name -match $pattern })
          if ($archive.Count -ne 1) { throw 'Expected exactly one CUDA package with the platform release policy' }
          $hash = ((Get-Content "$($archive[0].FullName).sha256" -Raw) -split '\s+')[0]
          ./scripts/verify-release-asset.ps1 -ArchivePath $archive[0].FullName -ExpectedSha256 $hash -ExpectedCommit '${{ github.sha }}' -ExpectedRuntime cuda -ExpectedGpuValidation not-run -RequireStandalone
  qt-package:
    name: Package ${{ matrix.platform }} Qt Desktop (${{ matrix.runtime }})
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-x64, linux-x64, macos-arm64]
        runtime: ${{ fromJSON(inputs.desktop_release_tag && '["cuda-vulkan"]' || '["cpu", "cuda-vulkan"]') }}
        exclude:
          - platform: macos-arm64
            runtime: cuda-vulkan
    runs-on: ${{ matrix.platform == 'windows-x64' && 'windows-2025-vs2026' || matrix.platform == 'linux-x64' && 'ubuntu-24.04' || 'macos-26' }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Validate supplemental release tag
        if: inputs.desktop_release_tag
        env:
          RELEASE_TAG: ${{ inputs.desktop_release_tag }}
        run: |
          if ($env:RELEASE_TAG -cnotmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') { throw 'Expected a stable release tag such as v1.15.11' }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.desktop_release_tag && format('refs/tags/{0}', inputs.desktop_release_tag) || github.sha }}
          persist-credentials: false
      # Use the source tag's build/dependency locks, but allow newer packagers to supplement an existing release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: inputs.desktop_release_tag
        with:
          ref: ${{ github.sha }}
          path: build/packaging-tools
          persist-credentials: false
      - uses: ./.github/actions/dependencies
        with:
          triplet: ${{ runner.os == 'Windows' && 'x64-windows-release' || runner.os == 'Linux' && 'x64-linux-release' || 'arm64-osx-release' }}
      - name: Install Linux linker and display libraries (no system Qt)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends patchelf libgl-dev libegl-dev libopengl-dev \
            libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-render-util0 libxcb-xkb1 libxcb-xinerama0 libxcb-xinput0 \
            libwayland-client0 libwayland-cursor0 libwayland-egl1
          if [[ '${{ matrix.runtime }}' == 'cuda-vulkan' ]]; then
            sudo apt-get install -y --no-install-recommends glslang-tools xvfb xauth
          fi
      - name: Prepare locked Qt SDK
        run: ./scripts/setup-qt.ps1 -InstallDir (Join-Path $env:RUNNER_TEMP 'mosaicraft-qt')
      - name: Prepare locked CUDA SDK and Vulkan build tools
        if: matrix.runtime == 'cuda-vulkan'
        run: |
          ./scripts/setup-cuda.ps1
          ./scripts/setup-vulkan.ps1
      - name: Build and verify Qt Desktop archive
        env:
          RELEASE_TAG: ${{ inputs.desktop_release_tag }}
        run: |
          $packager = './scripts/release-desktop.ps1'
          $commit = $env:GITHUB_SHA
          if ($env:RELEASE_TAG) {
            $packager = './build/packaging-tools/scripts/release-desktop.ps1'
            $commit = git rev-parse "refs/tags/$($env:RELEASE_TAG)^{commit}"
            if ($LASTEXITCODE -ne 0) { throw 'Cannot resolve package source tag' }
            $version = (Get-Content -Raw contracts.json | ConvertFrom-Json).softwareVersion
            if ($env:RELEASE_TAG -cne "v$version") { throw 'Release tag does not match contracts.json' }
          }
          $options = @{}
          if ('${{ matrix.runtime }}' -eq 'cuda-vulkan') { $options = @{ CudaVulkan = $true; GpuValidation = 'BuildOnly' } }
          & $packager -SourceDir $PWD.Path -ExpectedSourceCommit $commit -QtRoot $env:MOSAICRAFT_QT_ROOT @options
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.runtime == 'cpu' && format('qt-{0}', matrix.platform) || format('qt-cuda-vulkan-{0}', matrix.platform) }}
          path: build/archives-qt/Mosaicraft_v*
          compression-level: 0
          if-no-files-found: error
