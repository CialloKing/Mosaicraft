name: Verify published release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag (v1.14.7 or later)
        required: true
permissions:
  contents: read
jobs:
  verify:
    name: Verify ${{ matrix.platform }} ${{ matrix.runtime }} release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            runtime: cpu-only
            gpu-validation: not-applicable
            runner: windows-2025-vs2026
          - platform: windows-x64
            runtime: cuda
            gpu-validation: passed
            runner: windows-2025-vs2026
          - platform: linux-x64
            runtime: cpu-only
            gpu-validation: not-applicable
            runner: ubuntu-22.04
          - platform: linux-x64
            runtime: cuda
            gpu-validation: not-run
            runner: ubuntu-22.04
          - platform: windows-x64
            runtime: vulkan
            gpu-validation: not-run
            runner: windows-2025-vs2026
          - platform: linux-x64
            runtime: vulkan
            gpu-validation: not-run
            runner: ubuntu-22.04
          - platform: macos-arm64
            runtime: cpu-only
            gpu-validation: not-applicable
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/verify-native-package
        with:
          runtime: ${{ matrix.runtime }}
          gpu-validation: ${{ matrix.gpu-validation }}
          channel: stable
          tag: ${{ inputs.tag }}
