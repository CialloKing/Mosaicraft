name: Verify published release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag (v1.14.7 or later)
        required: true
      artifact_run:
        description: Optional full Native packages run ID to verify before publication instead of downloading release assets.
        required: false
        type: string
permissions:
  actions: read
  contents: read
jobs:
  verify:
    name: Verify ${{ matrix.platform }} ${{ matrix.runtime }} release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            runtime: cpu-only
            gpu-validation: not-applicable
            runner: windows-2025-vs2026
          - platform: windows-x64
            runtime: cuda
            gpu-validation: passed
            runner: windows-2025-vs2026
          - platform: linux-x64
            runtime: cpu-only
            gpu-validation: not-applicable
            runner: ubuntu-22.04
          - platform: linux-x64
            runtime: cuda
            gpu-validation: not-run
            runner: ubuntu-22.04
          - platform: windows-x64
            runtime: vulkan
            gpu-validation: not-run
            runner: windows-2025-vs2026
          - platform: linux-x64
            runtime: vulkan
            gpu-validation: not-run
            runner: ubuntu-22.04
          - platform: macos-arm64
            runtime: cpu-only
            gpu-validation: not-applicable
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve the intended product tag independently of the archive
        id: source
        if: inputs.artifact_run
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git fetch --depth=1 --no-tags origin "refs/tags/$TAG"
          echo "commit=$(git rev-parse 'FETCH_HEAD^{commit}')" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: inputs.artifact_run
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.artifact_run }}
          name: ${{ format('{0}-{1}', matrix.runtime == 'cpu-only' && 'cpu' || matrix.runtime, matrix.platform) }}
          path: build/download
      - uses: ./.github/actions/verify-native-package
        with:
          runtime: ${{ matrix.runtime }}
          expected-commit: ${{ steps.source.outputs.commit || github.sha }}
          gpu-validation: ${{ inputs.artifact_run && matrix.runtime == 'cuda' && runner.os == 'Windows' && 'not-run' || matrix.gpu-validation }}
          channel: ${{ inputs.artifact_run && matrix.runtime == 'cuda' && runner.os == 'Windows' && 'candidate' || 'stable' }}
          tag: ${{ !inputs.artifact_run && inputs.tag || '' }}
