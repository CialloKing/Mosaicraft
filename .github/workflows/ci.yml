name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      cache-namespace:
        description: Cache namespace for a cold/warm validation pair
        default: deps-v1
permissions:
  contents: read
jobs:
  command-shell:
    name: Web command formatting
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: node tests/test_command_shell.js
  documentation:
    name: Documentation links and index
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          cmake -S tools/release-check -B build/check-docs -DCMAKE_BUILD_TYPE=Release
          cmake --build build/check-docs --config Release --parallel 2
          ./build/check-docs/mosaicraft_release_check --docs "$GITHUB_WORKSPACE"
  cpu:
    name: ${{ matrix.platform }} CPU-only
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            runner: windows-2025-vs2026
          - platform: linux-x64
            runner: ubuntu-22.04
          - platform: macos-arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/native-dependencies
        if: runner.os == 'Windows'
        with:
          cache-namespace: ${{ inputs.cache-namespace || 'deps-v1' }}
      - name: Configure CPU Release
        if: runner.os == 'Windows'
        shell: bash
        run: cmake --preset '${{ matrix.platform }}'
      - name: Build CLI and Web UI
        if: runner.os == 'Windows'
        shell: bash
        run: cmake --build --preset '${{ matrix.platform }}' --target mosaicraft MosaicraftWebUI --parallel
      - name: Build with system packages
        if: runner.os != 'Windows'
        shell: sh
        run: |
          if [ "$RUNNER_OS" = Linux ]; then export PATH="/usr/bin:$PATH"; fi
          ./scripts/build-native.sh --install-deps
          ./build/${{ matrix.platform }}/Release/bin/mosaicraft --version
          ./build/${{ matrix.platform }}/Release/bin/MosaicraftWebUI --help
      - name: Upload diagnostics
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-${{ matrix.platform }}-${{ github.sha }}
          path: build/dependency-state/
          if-no-files-found: ignore
  desktop:
    name: Windows CPU Qt Desktop
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/native-dependencies
        with:
          cache-namespace: ${{ inputs.cache-namespace || 'deps-v1' }}
      - name: Prepare locked Qt SDK
        shell: pwsh
        run: ./scripts/setup-qt.ps1 -InstallDir (Join-Path $env:RUNNER_TEMP 'mosaicraft-qt')
      - name: Build and test the interactive backend
        shell: pwsh
        run: |
          cmake --preset windows-x64 -B build/windows-desktop-ci -DMOSAICRAFT_BUILD_DESKTOP=ON "-DCMAKE_PREFIX_PATH=$env:MOSAICRAFT_QT_ROOT"
          cmake --build build/windows-desktop-ci --config Release --target MosaicraftDesktop --parallel
          ctest --test-dir build/windows-desktop-ci -C Release -R '^desktop_smoke$' --no-tests=error --output-on-failure --timeout 180
