name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      cache-namespace:
        description: Cache namespace for a cold/warm validation pair
        default: deps-v1
permissions:
  contents: read
jobs:
  cpu:
    name: ${{ matrix.platform }} CPU-only
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            runner: windows-2025-vs2026
            triplet: x64-windows-release
          - platform: linux-x64
            runner: ubuntu-22.04
            triplet: x64-linux-release
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/dependencies
        with:
          triplet: ${{ matrix.triplet }}
          cache-namespace: ${{ inputs.cache-namespace || 'deps-v1' }}
      - name: Configure CPU Release
        run: |
          $preset = if ($IsWindows) { 'windows-cpu' } else { 'linux-cpu' }
          cmake --preset $preset -B build/ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build
        run: cmake --build build/ci --config Release --target mosaicraft MosaicraftWebUI mosaicraft_tests mosaicraft_regression_tests --parallel
      - name: CTest
        run: ctest --test-dir build/ci -C Release --output-on-failure
      - name: Web UI/API smoke
        run: cmake --build build/ci --config Release --target mosaicraft_webui_smoke
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-${{ matrix.platform }}-${{ github.sha }}
          path: |
            build/dependency-state/
            build/ci/Testing/Temporary/
          if-no-files-found: ignore
