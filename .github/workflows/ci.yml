name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      cache-namespace:
        description: Cache namespace for a cold/warm validation pair
        default: deps-v1
permissions:
  contents: read
jobs:
  command-shell:
    name: Web command formatting
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: node tests/test_command_shell.js
  documentation:
    name: Documentation links and index
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          cmake -S tools/release-check -B build/check-docs -DCMAKE_BUILD_TYPE=Release
          cmake --build build/check-docs --config Release --parallel 2
          ./build/check-docs/mosaicraft_release_check --docs "$GITHUB_WORKSPACE"
  cpu:
    name: ${{ matrix.platform }} CPU-only
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            runner: windows-2025-vs2026
          - platform: linux-x64
            runner: ubuntu-22.04
            jobs: 2
          - platform: macos-arm64
            runner: macos-15
            jobs: 2
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Ubuntu toolchain prerequisites
        if: runner.os == 'Linux'
        shell: sh
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build
          echo /usr/bin >> "$GITHUB_PATH"
      - name: Install macOS toolchain prerequisites
        if: runner.os == 'macOS'
        shell: sh
        run: brew install cmake ninja
      - uses: ./.github/actions/native-dependencies
        with:
          cache-namespace: ${{ inputs.cache-namespace || 'deps-v1' }}
      - name: Configure CPU Release
        shell: bash
        run: |
          cmake --preset '${{ matrix.platform }}' \
            "-DCMAKE_TOOLCHAIN_FILE=$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            "-DVCPKG_INSTALLED_DIR=$MOSAICRAFT_VCPKG_INSTALLED_DIR" \
            "-DVCPKG_OVERLAY_TRIPLETS=$VCPKG_OVERLAY_TRIPLETS" \
            "-DVCPKG_TARGET_TRIPLET=$VCPKG_DEFAULT_TRIPLET" \
            "-DVCPKG_HOST_TRIPLET=$VCPKG_DEFAULT_HOST_TRIPLET" -DVCPKG_MANIFEST_INSTALL=OFF
      - name: Build CLI and Web UI
        shell: bash
        run: cmake --build --preset '${{ matrix.platform }}' --target mosaicraft MosaicraftWebUI --parallel ${{ matrix.jobs }}
      - name: Smoke-test the native build
        if: runner.os != 'Windows'
        shell: sh
        run: |
          ./build/${{ matrix.platform }}/Release/bin/mosaicraft --version
          ./build/${{ matrix.platform }}/Release/bin/MosaicraftWebUI --help
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-${{ matrix.platform }}-${{ github.sha }}
          path: build/dependency-state/
          if-no-files-found: ignore
  desktop:
    name: Windows CPU Qt Desktop
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/native-dependencies
        with:
          cache-namespace: ${{ inputs.cache-namespace || 'deps-v1' }}
      - name: Prepare locked Qt SDK
        shell: bash
        run: cmake -DMODE=Qt -P cmake/PrepareRelease.cmake
      - name: Build and test the interactive backend
        shell: bash
        run: |
          cmake --preset windows-x64 -B build/windows-desktop-ci -DMOSAICRAFT_BUILD_DESKTOP=ON "-DCMAKE_PREFIX_PATH=$MOSAICRAFT_QT_ROOT"
          cmake --build build/windows-desktop-ci --config Release --target MosaicraftDesktop --parallel
          ctest --test-dir build/windows-desktop-ci -C Release -R '^desktop_smoke$' --no-tests=error --output-on-failure --timeout 180
