name: Audit CMake release packages
on:
  workflow_dispatch:
    inputs:
      phase:
        description: Validate in order CPU, portable, then CUDA (Windows CUDA on hosted runners is a candidate).
        type: choice
        options: [cpu, portable, cuda]
        default: cpu
      cold:
        description: Bypass dependency binary cache and audit subprocesses on Linux.
        type: boolean
        default: true
      published-tag:
        description: Also validate existing stable GitHub attachments for this phase (for example v1.15.10).
        required: false
permissions:
  contents: read
jobs:
  select:
    runs-on: ubuntu-22.04
    outputs:
      packages: ${{ steps.matrix.outputs.packages }}
    steps:
      - id: matrix
        env:
          PHASE: ${{ inputs.phase }}
        shell: bash
        run: |
          case "$PHASE" in
            cpu) packages='[
              {"id":"windows-cpu", "runner":"windows-2025-vs2026", "platform":"windows-x64", "runtime":"cpu-only", "channel":"stable", "gpu":"not-applicable"},
              {"id":"linux-cpu", "runner":"ubuntu-22.04", "platform":"linux-x64", "runtime":"cpu-only", "channel":"stable", "gpu":"not-applicable"},
              {"id":"macos-cpu", "runner":"macos-15", "platform":"macos-arm64", "runtime":"cpu-only", "channel":"stable", "gpu":"not-applicable"}]';;
            portable) packages='[
              {"id":"windows-vulkan", "runner":"windows-2025-vs2026", "platform":"windows-x64", "runtime":"vulkan", "channel":"stable", "gpu":"not-run"},
              {"id":"linux-vulkan", "runner":"ubuntu-22.04", "platform":"linux-x64", "runtime":"vulkan", "channel":"stable", "gpu":"not-run"},
              {"id":"windows-vulkan-candidate", "runner":"windows-2025-vs2026", "platform":"windows-x64", "runtime":"vulkan", "channel":"candidate", "gpu":"not-run"},
              {"id":"linux-vulkan-candidate", "runner":"ubuntu-22.04", "platform":"linux-x64", "runtime":"vulkan", "channel":"candidate", "gpu":"not-run"},
              {"id":"macos-metal", "runner":"macos-15", "platform":"macos-arm64", "runtime":"metal", "channel":"candidate", "gpu":"not-run"}]';;
            cuda) packages='[
              {"id":"windows-cuda", "runner":"windows-2025-vs2026", "platform":"windows-x64", "runtime":"cuda", "channel":"candidate", "gpu":"not-run"},
              {"id":"linux-cuda", "runner":"ubuntu-22.04", "platform":"linux-x64", "runtime":"cuda", "channel":"stable", "gpu":"not-run"},
              {"id":"windows-cuda-vulkan", "runner":"windows-2025-vs2026", "platform":"windows-x64", "runtime":"cuda-vulkan", "channel":"candidate", "gpu":"not-run"}]';;
            *) exit 1;;
          esac
          printf 'packages=%s\n' "$(jq -c . <<<"$packages")" >> "$GITHUB_OUTPUT"
  package:
    name: ${{ matrix.package.id }}
    needs: select
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.select.outputs.packages) }}
    runs-on: ${{ matrix.package.runner }}
    defaults:
      run:
        shell: bash
    env:
      RUNTIME: ${{ matrix.package.runtime }}
      CHANNEL: ${{ matrix.package.channel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use Ubuntu 22.04 system CMake and native utilities
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          tools=(ninja-build patchelf strace)
          if [[ "$RUNTIME" == *vulkan ]]; then tools+=(glslang-tools); fi
          sudo apt-get install -y --no-install-recommends "${tools[@]}"
          printf '%s\n' /usr/bin >> "$GITHUB_PATH"
      - uses: ./.github/actions/native-dependencies
        with:
          cold: ${{ inputs.cold }}
      - name: Prepare locked GPU SDKs
        env:
          AUDIT: ${{ inputs.cold }}
        run: |
          prepare_sdk() {
            local mode=$1
            local -a command=(cmake "-DMODE=$mode" -P cmake/PrepareRelease.cmake)
            if [[ "$RUNNER_OS" == Linux && "$AUDIT" == true ]]; then
              cmake "-DLOG=build/dependency-state/$mode-execve.log" -P cmake/AuditRelease.cmake -- "${command[@]}"
            else
              "${command[@]}"
            fi
          }
          if [[ "$RUNTIME" == cuda* ]]; then prepare_sdk CUDA; fi
          if [[ "$RUNTIME" == *vulkan ]]; then prepare_sdk Vulkan; fi
          if [[ "$RUNTIME" == metal ]]; then
            xcrun -sdk macosx metal --version || xcodebuild -downloadComponent MetalToolchain
          fi
      - name: Build, test and archive with CMake
        env:
          COLD: ${{ inputs.cold }}
        run: |
          options=()
          if [[ "$RUNTIME" == cuda* ]]; then options+=(-DCUDA_VALIDATION=BuildOnly); fi
          if [[ "$RUNNER_OS" == Linux && "$RUNTIME" == cuda ]]; then
            options+=(-DALLOW_UNVALIDATED_LINUX_CUDA=ON)
          fi
          command=(cmake "-DRUNTIME=$RUNTIME" "-DCHANNEL=$CHANNEL" -DBUILD_DIR=build/package-migration
            -DOUTPUT_DIR=build/migration-archives -DSMART_CROP=OFF -DSMART_CROP_CUDA=OFF "${options[@]}" -P cmake/Release.cmake)
          if [[ "$RUNNER_OS" == Linux && "$COLD" == true ]]; then
            cmake -DLOG=build/dependency-state/release-execve.log -P cmake/AuditRelease.cmake -- "${command[@]}"
          else
            "${command[@]}"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: migration-${{ matrix.package.id }}
          path: build/migration-archives/*
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: migration-${{ matrix.package.id }}-check-tool
          path: build/package-migration/Release/bin/mosaicraft_release_check*
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: migration-${{ matrix.package.id }}-diagnostics
          path: |
            build/dependency-state/
            build/package-migration/Testing/Temporary/
          if-no-files-found: ignore
  verify:
    name: Standalone ${{ matrix.package.id }} verification
    needs: [select, package]
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.select.outputs.packages) }}
    runs-on: ${{ matrix.package.runner }}
    defaults:
      run:
        shell: bash
    env:
      EXPECT_RUNTIME: ${{ matrix.package.runtime }}
      EXPECT_GPU: ${{ matrix.package.gpu }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: migration-${{ matrix.package.id }}*
          merge-multiple: false
          path: build/comparison
      - name: Check archive without project dependencies
        env:
          PACKAGE_ID: ${{ matrix.package.id }}
          COLD: ${{ inputs.cold }}
          PUBLISHED_TAG: ${{ inputs.published-tag }}
          ASSET_PLATFORM: ${{ matrix.package.platform }}
          CHANNEL: ${{ matrix.package.channel }}
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          suffix= extension=tar.gz
          if [[ "$RUNNER_OS" == Windows ]]; then suffix=.exe; extension=zip; fi
          base="build/comparison/migration-$PACKAGE_ID"
          tool="$base-check-tool/mosaicraft_release_check$suffix"
          chmod +x "$tool"
          audit=()
          if [[ "$RUNNER_OS" == Linux && "$COLD" == true ]]; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends strace
            audit=(cmake -DLOG=build/standalone-verify-execve.log -P cmake/AuditRelease.cmake --)
          fi
          "${audit[@]}" cmake "-DARCHIVE_DIR=$base" "-DEXPECTED_COMMIT=$GITHUB_SHA" \
            "-DEXPECTED_RUNTIME=$EXPECT_RUNTIME" "-DEXPECTED_GPU_VALIDATION=$EXPECT_GPU" \
            "-DEXPECTED_CHANNEL=$CHANNEL" "-DCHECK_TOOL=$tool" -DREQUIRE_CURRENT=ON -P cmake/VerifyPackage.cmake
          if [[ -n "$PUBLISHED_TAG" && ( "$CHANNEL" == stable || "$PACKAGE_ID" == windows-cuda ) ]]; then
            gpu=$EXPECT_GPU
            if [[ "$PACKAGE_ID" == windows-cuda ]]; then gpu=passed; fi
            cmake "-DTAG=$PUBLISHED_TAG" "-DREPOSITORY=$GITHUB_REPOSITORY" \
              "-DASSET=Mosaicraft_${PUBLISHED_TAG}_${ASSET_PLATFORM}_${EXPECT_RUNTIME}.$extension" \
              "-DEXPECTED_RUNTIME=$EXPECT_RUNTIME" "-DEXPECTED_GPU_VALIDATION=$gpu" "-DCHECK_TOOL=$tool" \
              -P cmake/VerifyPackage.cmake
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && runner.os == 'Linux' && inputs.cold
        with:
          name: migration-${{ matrix.package.id }}-verify-audit
          path: build/*-verify-execve.log
          if-no-files-found: ignore
